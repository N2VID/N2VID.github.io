<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N2VID</title>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/199596053?v=4" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shade: 0.32;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #171a21;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #232735;
        --accent: #60a5fa;
        --accent-hover: #93c5fd;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        --shade: 0.62;
      }
    }

    [data-theme="light"] {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #1a1a1a;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
      --shade: 0.32;
    }

    [data-theme="dark"] {
      --bg: #0f1115;
      --card: #171a21;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #232735;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      --shade: 0.62;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Vazirmatn", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .shape {
      position: absolute;
      bottom: -12%;
      font-size: var(--s);
      color: rgba(var(--c, 59, 130, 246), var(--shade, 0.32));
      filter: blur(0.5px);
      user-select: none;
      animation: floatUp var(--d, 20s) linear infinite;
      animation-delay: var(--dl, 0s);
      will-change: transform;
    }

    .shape i {
      font-style: normal;
      display: inline-block;
      font-family: inherit;
      animation: sway var(--sw, 9s) ease-in-out infinite alternate;
      animation-delay: var(--dl, 0s);
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) rotate(-12deg); }
      100% { transform: translateY(-118vh) rotate(18deg); }
    }

    @keyframes sway {
      from { transform: translateX(-18px); }
      to   { transform: translateX(18px); }
    }

    .toggle-wrap {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 10px;
      direction: ltr;
    }

    .icon-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      height: 40px;
      min-width: 40px;
      padding: 0 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow);
      transition: transform 0.2s, background 0.3s, border-color 0.3s;
    }

    .icon-btn:hover {
      transform: scale(1.08);
      border-color: var(--accent);
    }

    #theme-toggle {
      font-size: 18px;
      letter-spacing: 0;
    }

    #lang-btn {
      padding: 0 14px;
      white-space: nowrap;
      letter-spacing: 0.02em;
      transition: background 0.3s, border-color 0.3s;
      color: var(--accent);
    }

    #lang-btn:hover {
      transform: none;
    }

    .corner-bl {
      position: fixed;
      bottom: 18px;
      left: 18px;
      z-index: 10;
    }

    #tg-btn {
      width: 46px;
      height: 46px;
      padding: 0;
      flex: 0 0 46px;
      border-radius: 12px;
      color: var(--accent);
      text-decoration: none;
    }

    #tg-btn svg {
      width: 20px;
      height: 20px;
      fill: var(--accent);
    }

    main {
      flex: 1;
      max-width: 640px;
      margin: 0 auto;
      padding: 72px 20px 48px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .profile {
      text-align: center;
      margin-bottom: 52px;
    }

    .avatar-wrap {
      display: inline-block;
      margin-bottom: 20px;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--card);
      box-shadow: var(--shadow);
      display: block;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .handle {
      color: var(--muted);
      font-size: 15px;
      margin: 6px 0 20px;
      direction: ltr;
    }

    @property --angle {
      syntax: "<angle>";
      initial-value: 0deg;
      inherits: false;
    }

    .social {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 999px;
      border: 2px solid transparent;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      background:
        linear-gradient(var(--card), var(--card)) padding-box,
        conic-gradient(from var(--angle), #ff004c, #ff9300, #ffeb00, #2eff00, #00e5ff, #6a00ff, #ff00d4, #ff004c) border-box;
      animation: rainbowSpin 3s linear infinite;
      transition: transform 0.2s;
      z-index: 0;
    }

    .social::before {
      content: "";
      position: absolute;
      inset: -7px;
      border-radius: inherit;
      background: conic-gradient(from var(--angle), #ff004c, #ff9300, #ffeb00, #2eff00, #00e5ff, #6a00ff, #ff00d4, #ff004c);
      filter: blur(18px);
      opacity: 0.45;
      z-index: -1;
      animation: rainbowSpin 3s linear infinite;
    }

    .social svg {
      width: 18px;
      height: 18px;
      fill: var(--accent);
    }

    .social:hover {
      transform: translateY(-2px);
    }

    @keyframes rainbowSpin {
      to { --angle: 360deg; }
    }

    .section-title {
      font-size: 15px;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .project {
      background: color-mix(in srgb, var(--card) 92%, transparent);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow);
      transition: transform 0.2s, border-color 0.3s;
    }

    .project:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .project-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .project-name {
      font-size: 17px;
      font-weight: 700;
      text-align: right;
    }

    .lang {
      font-size: 12px;
      color: var(--muted);
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }

    .project-desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.9;
      margin-bottom: 18px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      transition: background 0.2s, transform 0.2s;
    }

    .btn svg {
      width: 15px;
      height: 15px;
      fill: currentColor;
    }

    .b-icon {
      font-size: 15px;
      line-height: 1;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-outline:hover {
      background: var(--card);
      border-color: var(--accent);
    }

    footer {
      text-align: center;
      padding: 32px 20px;
      color: var(--muted);
      font-size: 13px;
      position: relative;
      z-index: 1;
    }

    footer a {
      color: var(--accent);
      text-decoration: none;
    }

    @media (max-width: 520px) {
      .avatar {
        width: 96px;
        height: 96px;
      }
    }
  </style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <!-- Xbox: A (green) -->
    <span class="shape" style="--s:3.2rem; left:6%;  --c:16,124,16;  --d:22s; --dl:0s;"><i>A</i></span>
    <span class="shape" style="--s:2.4rem; left:16%; --c:16,124,16;  --d:19s; --dl:-4s;"><i>A</i></span>
    <!-- Xbox: B (red) -->
    <span class="shape" style="--s:2.4rem; left:58%; --c:225,6,0;   --d:17s; --dl:-3s;"><i>B</i></span>
    <span class="shape" style="--s:3rem;   left:3%;  --c:225,6,0;   --d:28s; --dl:-18s;"><i>B</i></span>
    <!-- Xbox: X (blue) -->
    <span class="shape" style="--s:3rem;   left:28%; --c:0,164,239; --d:25s; --dl:-8s;"><i>X</i></span>
    <span class="shape" style="--s:3.4rem; left:22%; --c:0,164,239; --d:27s; --dl:-20s;"><i>X</i></span>
    <!-- Xbox: Y (yellow) -->
    <span class="shape" style="--s:2.2rem; left:40%; --c:255,185,0; --d:18s; --dl:-2s;"><i>Y</i></span>
    <span class="shape" style="--s:2.1rem; left:92%; --c:255,185,0; --d:20s; --dl:-5s;"><i>Y</i></span>
    <!-- PlayStation: Triangle (green) -->
    <span class="shape" style="--s:3.4rem; left:52%; --c:140,198,63; --d:24s; --dl:-11s;"><i>▲</i></span>
    <span class="shape" style="--s:2.5rem; left:82%; --c:140,198,63; --d:19s; --dl:-7s;"><i>▲</i></span>
    <!-- PlayStation: Circle (pink/red) -->
    <span class="shape" style="--s:2.6rem; left:64%; --c:240,67,147; --d:20s; --dl:-6s;"><i>●</i></span>
    <span class="shape" style="--s:2.2rem; left:34%; --c:240,67,147; --d:21s; --dl:-9s;"><i>●</i></span>
    <!-- PlayStation: Cross (blue) -->
    <span class="shape" style="--s:3rem;   left:76%; --c:46,107,214; --d:23s; --dl:-13s;"><i>✕</i></span>
    <span class="shape" style="--s:2.3rem; left:70%; --c:46,107,214; --d:22s; --dl:-12s;"><i>✕</i></span>
    <!-- PlayStation: Square (purple) -->
    <span class="shape" style="--s:2.4rem; left:88%; --c:169,117,217; --d:17s; --dl:-3s;"><i>■</i></span>
    <span class="shape" style="--s:2.9rem; left:45%; --c:169,117,217; --d:24s; --dl:-16s;"><i>■</i></span>
  </div>

  <div class="toggle-wrap">
    <button id="lang-btn" class="icon-btn" title="Language">تغییر به فارسی</button>
    <button id="theme-toggle" class="icon-btn" aria-label="Toggle theme" title="Toggle theme"></button>
  </div>

  <div class="corner-bl">
    <a id="tg-btn" class="icon-btn" href="https://t.me/N2VID_0" target="_blank" rel="noopener" aria-label="Telegram" title="Telegram">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M23.91 3.79L20.3 20.84c-.25 1.21-.98 1.5-2 .94l-5.5-4.07-2.66 2.57c-.3.3-.55.56-1.1.56-.72 0-.6-.27-.84-.95L6.3 13.7l-5.45-1.7c-1.18-.35-1.19-1.16.26-1.75l21.26-8.2c.97-.43 1.9.24 1.54 1.74z"/>
      </svg>
    </a>
  </div>

  <main>
    <section class="profile">
      <div class="avatar-wrap">
        <img class="avatar" src="https://avatars.githubusercontent.com/u/199596053?v=4" alt="N2VID">
      </div>
      <h1>N2VID</h1>
      <p class="handle">@N2VID</p>
      <a class="social" href="https://github.com/N2VID" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.55v-2.15c-3.2.7-3.87-1.37-3.87-1.37-.52-1.33-1.28-1.68-1.28-1.68-1.04-.72.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.02 1.75 2.68 1.25 3.33.96.1-.74.4-1.25.73-1.54-2.55-.29-5.23-1.28-5.23-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.04 0 0 .96-.31 3.15 1.18a10.98 10.98 0 0 1 5.74 0c2.19-1.49 3.15-1.18 3.15-1.18.62 1.58.23 2.75.11 3.04.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.66.41.35.77 1.04.77 2.1v3.11c0 .3.21.66.8.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/>
        </svg>
        <span data-i18n="social">My GitHub</span>
      </a>
    </section>

    <section>
      <h2 class="section-title" data-i18n="projects">Projects</h2>
      <div class="grid">

        <article class="project">
          <div class="project-top">
            <span class="project-name" data-i18n="projName">Microphone Booster</span>
            <span class="lang">Python</span>
          </div>
          <p class="project-desc" data-i18n="desc">Real-time microphone booster for Windows — boost, noise gate, voice detection, and speaker playback with low latency. Bilingual UI (Persian/English).</p>
          <div class="actions">
            <a class="btn btn-primary" href="https://github.com/N2VID/Microphone_Booster" target="_blank" rel="noopener">
              <span class="b-icon">🏠</span>
              <span data-i18n="home">Home</span>
            </a>
            <a class="btn btn-outline" href="https://github.com/N2VID/Microphone_Booster/releases" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
              <span data-i18n="releases">Releases</span>
            </a>
          </div>
        </article>

      </div>
    </section>
  </main>

  <footer>
    <span data-i18n="footer">Built with</span> <a href="https://github.com/N2VID" target="_blank" rel="noopener">N2VID</a>
  </footer>

  <script>
    const btn = document.getElementById("theme-toggle");
    const root = document.documentElement;

    const themeIcons = { light: "🌙", dark: "☀️" };

    const savedTheme = localStorage.getItem("theme");
    const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
    const theme = savedTheme || (systemDark ? "dark" : "light");

    function applyTheme(t) {
      root.setAttribute("data-theme", t);
      btn.textContent = themeIcons[t];
    }

    applyTheme(theme);

    btn.addEventListener("click", () => {
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      localStorage.setItem("theme", next);
      applyTheme(next);
    });

    const langBtn = document.getElementById("lang-btn");

    const i18n = {
      en: {
        projName: "Microphone Booster",
        social: "My GitHub",
        projects: "Projects",
        home: "Home",
        releases: "Releases",
        desc: "Real-time microphone booster for Windows — boost, noise gate, voice detection, and speaker playback with low latency. Bilingual UI (Persian/English).",
        footer: "Built with"
      },
      fa: {
        projName: "تقویت‌کننده میکروفون",
        social: "ادامه در گیت‌هاب",
        projects: "پروژه‌ها",
        home: "صفحه اصلی",
        releases: "ریلیزها",
        desc: "تقویت‌کننده بدون تأخیر میکروفون برای ویندوز — تقویت صدا، نویزگیر، تشخیص صدا و پخش مستقیم با کمترین تأخیر، همراه با رابط دوزبانه فارسی و انگلیسی.",
        footer: "ساخته‌شده با"
      }
    };

    let lang = "en";

    function setLang(l) {
      const t = i18n[l];
      root.lang = l;
      root.dir = l === "fa" ? "rtl" : "ltr";
      Object.keys(t).forEach((key) => {
        document.querySelectorAll(`[data-i18n="${key}"]`).forEach((el) => {
          el.textContent = t[key];
        });
      });
      langBtn.textContent = l === "fa" ? "Change to English" : "تغییر به فارسی";
    }

    setLang(lang);

    langBtn.addEventListener("click", () => {
      setLang(lang === "en" ? "fa" : "en");
      lang = lang === "en" ? "fa" : "en";
    });
  </script>
</body>
</html>
